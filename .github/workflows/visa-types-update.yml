name: DHA Visa Types Scraper → Firebase Hosting

on:
  schedule:
    # Every Sunday at 03:00 UTC (13:00 AEST / 14:00 AEDT)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      force_deploy:
        description: 'Deploy even if no changes detected'
        required: false
        default: 'false'

jobs:
  scrape-and-deploy:
    name: Scrape DHA → Update visa-types.json → Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Python
      # -----------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      # -----------------------------------------------------------------------
      # 3. Install Python dependencies
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: pip install requests beautifulsoup4

      # -----------------------------------------------------------------------
      # 4. Download current live JSON files so the deploy preserves them
      #    (skilled-occupations.json and processing-times.json are managed
      #     separately; we pull them before deploying so Firebase Hosting
      #     does not delete them.)
      # -----------------------------------------------------------------------
      - name: Download existing live JSON files into public/
        run: |
          mkdir -p public
          echo "Pulling current skilled-occupations.json …"
          curl -fsSL https://migrateau.jsmglobal.xyz/skilled-occupations.json \
               -o public/skilled-occupations.json \
            || echo "Warning: could not fetch skilled-occupations.json (may not exist yet)"
          echo "Pulling current processing-times.json …"
          curl -fsSL https://migrateau.jsmglobal.xyz/processing-times.json \
               -o public/processing-times.json \
            || echo "Warning: could not fetch processing-times.json (may not exist yet)"

      # -----------------------------------------------------------------------
      # 5. Run the DHA scraper
      #    Exit codes:
      #      0 = no changes (snapshot_date updated, no structural changes)
      #      1 = error
      #      2 = changes detected (added/removed/status-changed visas)
      # -----------------------------------------------------------------------
      - name: Run DHA visa scraper
        id: scrape
        run: |
          set +e
          python scripts/dha_visa_scraper.py
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          # Don't fail the job on exit code 2 (changes detected — that's good!)
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "Scraper failed with exit code 1"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # 6. Commit updated visa-types.json back to the repo (if changed)
      # -----------------------------------------------------------------------
      - name: Commit updated visa-types.json
        if: steps.scrape.outputs.exit_code == '2' || github.event.inputs.force_deploy == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/visa-types.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): auto-update visa-types.json from DHA [$(date -u +%Y-%m-%d)]"
            git push
          fi

      # -----------------------------------------------------------------------
      # 7. Set up Node.js for Firebase CLI
      # -----------------------------------------------------------------------
      - name: Set up Node.js
        if: steps.scrape.outputs.exit_code == '2' || github.event.inputs.force_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # -----------------------------------------------------------------------
      # 8. Install Firebase CLI
      # -----------------------------------------------------------------------
      - name: Install Firebase CLI
        if: steps.scrape.outputs.exit_code == '2' || github.event.inputs.force_deploy == 'true'
        run: npm install -g firebase-tools

      # -----------------------------------------------------------------------
      # 9. Deploy to Firebase Hosting
      #    Only runs if changes were detected OR force_deploy is true.
      #    Uses FIREBASE_SERVICE_ACCOUNT secret (same one as the news scraper).
      # -----------------------------------------------------------------------
      - name: Deploy to Firebase Hosting
        if: steps.scrape.outputs.exit_code == '2' || github.event.inputs.force_deploy == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          # Write credentials to a temp file
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/service_account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/service_account.json
          firebase deploy --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
          rm -f /tmp/service_account.json

      # -----------------------------------------------------------------------
      # 10. Always log summary
      # -----------------------------------------------------------------------
      - name: Log summary
        if: always()
        run: |
          echo "=== visa-types.json summary ==="
          if [ -f public/visa-types.json ]; then
            python3 -c "
          import json
          with open('public/visa-types.json') as f:
              d = json.load(f)
          print(f'Snapshot date : {d[\"snapshot_date\"]}')
          print(f'Last changed  : {d[\"last_changed\"]}')
          print(f'Active visas  : {d[\"total_active\"]}')
          print(f'Repealed visas: {d[\"total_repealed\"]}')
          "
          else
            echo "visa-types.json not found"
          fi
