name: Run State News Scraper

on:
  schedule:
    # Runs daily at 02:00 UTC (12:00 AEST / 13:00 AEDT)
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  scrape:
    name: Scrape Migration News → Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Python
      # -----------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      # -----------------------------------------------------------------------
      # 3. Install Python dependencies
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # -----------------------------------------------------------------------
      # 4. Write Firebase service account key from secret
      #    (Store the entire JSON as the secret FIREBASE_SERVICE_ACCOUNT_JSON)
      # -----------------------------------------------------------------------
      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > scripts/service_account.json

      # -----------------------------------------------------------------------
      # 5. Run the scraper
      # FCM is handled by a Firebase Cloud Function (fcm_triggers collection)
      # — no legacy server key required.
      # -----------------------------------------------------------------------
      - name: Run scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: swift-shore-238707
        run: python scripts/state_news_scraper.py

      # -----------------------------------------------------------------------
      # 6. Run the state occupation requirements scraper
      # Outputs public/state-occupation-requirements.json for Firebase Hosting
      # -----------------------------------------------------------------------
      - name: Run state occupation requirements scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: swift-shore-238707
        run: python scripts/state_requirements_scraper.py

      # -----------------------------------------------------------------------
      # 7. Run the SkillSelect invitation rounds scraper
      # Outputs repo/public/invitation-rounds.json for Firebase Hosting
      # -----------------------------------------------------------------------
      - name: Run SkillSelect rounds scraper
        run: python scripts/rounds_scraper.py

      # -----------------------------------------------------------------------
      # 7b. Run the JSA salaries scraper
      # Outputs public/salaries.json (median weekly/annual earnings per ANZSCO,
      # sourced from jobsandskills.gov.au).
      # -----------------------------------------------------------------------
      - name: Run salaries scraper
        run: python scripts/salaries_scraper.py

      # -----------------------------------------------------------------------
      # 8. Deploy updated JSON files to Firebase Hosting
      # -----------------------------------------------------------------------
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          projectId: swift-shore-238707
          channelId: live

      # -----------------------------------------------------------------------
      # 8. Remove sensitive file before artifact upload
      # -----------------------------------------------------------------------
      - name: Clean up service account key
        if: always()
        run: rm -f scripts/service_account.json

      # -----------------------------------------------------------------------
      # 9. Upload scraper log as artifact (kept for 7 days)
      # -----------------------------------------------------------------------
      - name: Upload scraper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log-${{ github.run_id }}
          path: scripts/scraper.log
          retention-days: 7
